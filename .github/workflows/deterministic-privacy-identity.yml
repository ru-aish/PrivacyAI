name: Deterministic privacy identity

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/wave2-deterministic-privacy-identity

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @privacy-ai/sdk test
      - run: pnpm --filter @privacy-ai/agent-bridge test
      - run: pnpm --filter @privacy-ai/web-demo test
      - run: pnpm --filter @privacy-ai/agent-tui test
      - run: git diff --check
