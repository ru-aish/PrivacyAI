name: Lineage local state

on:
  pull_request:
    paths:
      - ".github/workflows/lineage-local-state.yml"
      - "docs/lineage-local-state.md"
      - "packages/agent-bridge/**"
      - "packages/sdk/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

concurrency:
  group: lineage-local-state-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check changed files
        run: git diff --check origin/${{ github.base_ref }}...HEAD
      - name: Check lineage syntax
        run: |
          node --check packages/agent-bridge/src/lineage/domain.js
          node --check packages/agent-bridge/src/lineage/schema.js
          node --check packages/agent-bridge/src/lineage/sqlite-repository.js
          node --check packages/agent-bridge/src/lineage/open.js
          node --check packages/agent-bridge/src/lineage/index.js
          node --check packages/agent-bridge/test/fixtures/lineage-child.js
          node --check packages/agent-bridge/test/lineage.test.js
      - name: Test immutable lineage repository
        run: node --test packages/agent-bridge/test/lineage.test.js
      - name: Test SDK contracts
        run: pnpm --filter @privacy-ai/sdk test
      - name: Test agent bridge
        run: pnpm --filter @privacy-ai/agent-bridge test
      - name: Test product shell integration
        run: pnpm --filter @privacy-ai/agent-tui test
