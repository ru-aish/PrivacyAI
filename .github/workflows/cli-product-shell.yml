name: CLI product shell

on:
  pull_request:
    paths:
      - ".github/workflows/cli-product-shell.yml"
      - "README.md"
      - "packages/agent-tui/**"
      - "packages/agent-bridge/**"
      - "packages/sdk/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @privacy-ai/cli test
      - run: pnpm --filter @privacy-ai/agent-bridge test
      - run: pnpm -r test
      - run: git diff --check
